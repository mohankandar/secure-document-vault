# Local-only override: durable Vault state for document-viewer regression testing.
# Use with: docker compose -f compose.local.yml -f compose.vault-persistent.yml up -d --force-recreate sdv-vault
# Do NOT use as a production Vault deployment definition.
services:
  sdv-vault:
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: null
    command: ["server", "-config=/vault/config/vault.hcl"]
    volumes:
      - sdv-vault-data:/vault/data
      - ./config/vault-local-persistent.hcl:/vault/config/vault.hcl:ro
    restart: unless-stopped
volumes:
  sdv-vault-data:
    name: sdv-vault-persistent-data
