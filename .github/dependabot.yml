# Dependabot version updates (task 0047).
#
# Every Dependabot pull request goes through CI like any other pull request and needs a green "ci-passed".
# Nothing merges by itself: there is no auto-merge workflow, and the owner merges each pull request by hand.
#
# At most 5 open Dependabot pull requests in total: 2 for GitHub Actions plus 3 for npm.
#
# Maven is not listed yet. platform-core comes from GitHub Packages, so Dependabot would need the read:packages
# token as a Dependabot secret and a maven-repository registry entry here. platform-core versions are bumped by
# hand per release. See docs/work/0047-report.md for how to add it later.
version: 2

updates:
  # Workflow actions are pinned to full commit SHAs with a "# vX.Y.Z" comment. Dependabot keeps the pin and
  # updates both the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/vero-r7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /frontend/sdv-ui
    target-branch: release/vero-r7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    groups:
      # All minor and patch updates in one pull request. Major updates are not in any group, so each one gets
      # a pull request of its own.
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
