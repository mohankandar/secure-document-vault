# The customer's web server for Vero, from the install runbook ("Sign-in in the browser, and serving the screens",
# "Notifications" 4c). Here on http://localhost:18299 for the proof; a customer's does TLS.
server {
    listen 80;
    root /srv/vero/screens;
    client_max_body_size 110m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' blob: data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://localhost:18298; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://host.docker.internal:8297;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /actuator/ { return 404; }
    location ^~ /approvals/link/ {
        access_log off;
        add_header Referrer-Policy no-referrer always;
        try_files /index.html =404;
    }
    location / { try_files $uri /index.html; }
}
