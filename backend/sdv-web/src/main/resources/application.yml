spring:
  application:
    name: secure-document-vault
  jackson:
    # Task 0070: only what Vero names reads and writes JSON (Boot 4 would add every module it finds).
    find-and-add-modules: false
  datasource:
    url: ${SDV_DB_URL:}
    username: ${SDV_DB_USERNAME:}
    password: ${SDV_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${SDV_DB_POOL_MAX:10}
      minimum-idle: ${SDV_DB_POOL_MIN:1}
  liquibase:
    # Starting Vero changes nothing in the database, in every profile (task 0041, owner answer 10: local too). The
    # database team applies changesets with the schema step (Update-SDV-Schema.ps1 / update-sdv-schema.sh, always
    # context "production"), which also runs platform-core's identity and licensing runs; DatabaseSchemaCheck refuses
    # to serve until the database matches.
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: production
  flyway:
    # Task 0041: Flyway is on the classpath for the schema step's platform-core runs only; never at startup.
    enabled: false

platform:
  # Task 0057: platform-core's safe outbound rules (platform-outbound-spring). Only the IT Admin's read-only "Test
  # sign-in" uses them: platform-core's identity module fetches the login system's discovery document and keys over
  # them (https only, no redirects, no internal or cloud-metadata addresses unless allowed). A local login server on
  # http (localhost) is reached only under a development-signed licence. A proxy and a private certificate authority
  # are set with PLATFORM_OUTBOUND_PROXY_* and PLATFORM_OUTBOUND_PRIVATE_CA_FILE (docs/install/SETUP.md section 5).
  outbound:
    installation: ${SDV_OUTBOUND_INSTALLATION:on-premises}
    allow-internal-addresses: ${SDV_OUTBOUND_ALLOW_INTERNAL_ADDRESSES:false}

server:
  port: ${SDV_SERVER_PORT:8280}
  shutdown: graceful

management:
  info:
    # Task 0070: /actuator/info is open; the process part (working directory) stays off.
    process:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Task 0074: details (the check list on /actuator/health/dependencies) for IT Admin and Platform operations only.
      show-details: when-authorized
      roles: IT_ADMIN,PLATFORM_OPERATIONS_ADMIN
      # /actuator/health/liveness: the process is alive. /actuator/health/readiness: Vero can take work. While the
      # database doesn't match this version Vero stays up (liveness UP) but is not ready (readiness OUT_OF_SERVICE).
      # Task 0037: readiness also pings the database (databaseConnection), so it is DOWN while the database is gone
      # after the start, and ready again when it answers.
      # Task 0038: with enterprise-jwt, readiness also fetches the sign-in hub's keys (signInKeys, SDV-AUT-004).
      # Task 0039 (owner answer to report 0038, 4): databaseConnection and signInKeys belong to readiness only. They
      # report NOT_READY (not DOWN). Only readiness lists NOT_READY in its status order and maps it to 503; the overall
      # /actuator/health and liveness don't list it, so Spring ignores it there and neither turns DOWN while the hub or
      # the database is away. Liveness stays livenessState only (Spring's default group), UP while the process runs.
      # Task 0040 part 2: the database ping reports BUSY when no connection is free (pool full, or PostgreSQL has none
      # left). Ordered after not-ready, so readiness says BUSY only when busy is the one reason; it is 503 with
      # SDV-SYS-018 and Retry-After (ReadinessBusyAnswer). Liveness and the overall health ignore it, as NOT_READY.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,databaseSchema,databaseConnection,signInKeys
          status:
            order: down,out-of-service,not-ready,busy,up,unknown
            http-mapping:
              down: 503
              out-of-service: 503
              not-ready: 503
              busy: 503
  health:
    defaults:
      enabled: true
    # Task 0039: Spring's own database check would make the overall health DOWN while the database is away; Vero's
    # databaseConnection ping replaces it, in readiness only.
    db:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-no-correlation}] [caller=%X{callerReference:--}] %logger{40} - %msg%n"

sdv:
  auth:
    # Production defaults fail closed. Local acceptance explicitly switches to local-header in application-local.yml.
    # Enterprise deployments set SDV_AUTH_MODE=enterprise-jwt and configure issuer/JWKS/audience below.
    mode: ${SDV_AUTH_MODE:disabled}
    # Task 0065: what the browser asks the login system for.
    browser-scope: ${SDV_AUTH_BROWSER_SCOPE:openid profile email}
    jwt:
      issuer: ${SDV_AUTH_JWT_ISSUER:}
      jwk-set-uri: ${SDV_AUTH_JWT_JWK_SET_URI:}
      audience: ${SDV_AUTH_JWT_AUDIENCE:}
      # Task 0065: the longest life of a token Vero accepts, 1 to 86400 seconds.
      max-token-lifetime-seconds: ${SDV_AUTH_JWT_MAX_TOKEN_LIFETIME_SECONDS:7200}
      # Task 0041: who may sign in, with which role in which entity, and which client may send for which entity and
      # source, come from platform-core's idn_ tables (loaded by the setup command). The provider ID is the sign-in
      # file's "providerId"; with the issuer and the audience it finds the customer's login connection.
      provider-id: ${SDV_AUTH_JWT_PROVIDER_ID:customer-oidc}
      username-claim: ${SDV_AUTH_JWT_USERNAME_CLAIM:preferred_username}
      email-claim: ${SDV_AUTH_JWT_EMAIL_CLAIM:email}
      display-name-claim: ${SDV_AUTH_JWT_DISPLAY_NAME_CLAIM:name}
      groups-claim: ${SDV_AUTH_JWT_GROUPS_CLAIM:groups}
      # Sending systems: the client ID (first of these claims that holds one; all must agree) finds the client binding.
      client-id-claims: ${SDV_AUTH_JWT_CLIENT_ID_CLAIMS:azp,client_id,cid}
      # Optional claims of a sending system's token; when present they must match its client binding.
      entity-claim: ${SDV_AUTH_JWT_ENTITY_CLAIM:sdv_entity_id}
      source-id-claim: ${SDV_AUTH_JWT_SOURCE_ID_CLAIM:sdv_source_id}
      source-key-claim: ${SDV_AUTH_JWT_SOURCE_KEY_CLAIM:sdv_source_key}
      # Task 0062: a sending system's token must be its client's own (client credentials). Claims of a person's sign-in
      # are always refused; the login system's own mark can be required too, for example Keycloak
      # preferred_username = service-account-{client}, or idtyp = app.
      machine-claim: ${SDV_AUTH_JWT_MACHINE_CLAIM:}
      machine-claim-value: ${SDV_AUTH_JWT_MACHINE_CLAIM_VALUE:}
      # Task 0067: claims that name a person; a sending system's token with one is refused.
      person-claims: ${SDV_AUTH_JWT_PERSON_CLAIMS:email,upn,given_name,family_name,name,uid}

  # Task 0067: removed. Licence keys come only from the build (backend/licence-build). Set, it stops the start.
  identity:
    trusted-keys-file: ${SDV_TRUSTED_KEYS_FILE:}

  # Task 0062: the largest request body, in bytes: any request (1 MB) and a submission (8 MB). Not for document uploads,
  # which have the sending system's own limit. Over it: 413 SDV-SYS-019.
  limits:
    request-body-bytes: ${SDV_MAX_REQUEST_BODY_BYTES:1048576}
    submission-body-bytes: ${SDV_MAX_SUBMISSION_BODY_BYTES:8388608}
    # Task 0071: intake requests of one sending system in a minute, in this process (60 to 1000000). Over it: 503 SDV-SYS-018.
    intake-requests-per-minute: ${SDV_INTAKE_REQUESTS_PER_MINUTE:6000}

  # Task 0063: reading PDFs. At most max-concurrent at once (0: from memory and processors), max-per-person for one
  # person or sending system; the rest wait wait-seconds, then 503 SDV-SYS-018 (busy). A work longer than limit-seconds is
  # given up. The working space beyond scratch-memory-bytes is an encrypted temporary file (scratch-folder; empty: the
  # system's). accept: what a sending system may send all the same, "source-key=encrypted,active-content,unreadable;...".
  pdf:
    max-concurrent: ${SDV_PDF_MAX_CONCURRENT:0}
    max-per-person: ${SDV_PDF_MAX_PER_PERSON:3}
    wait-seconds: ${SDV_PDF_WAIT_SECONDS:8}
    limit-seconds: ${SDV_PDF_LIMIT_SECONDS:30}
    scratch-folder: ${SDV_PDF_SCRATCH_FOLDER:}
    scratch-memory-bytes: ${SDV_PDF_SCRATCH_MEMORY_BYTES:16777216}
    scratch-total-bytes: ${SDV_PDF_SCRATCH_TOTAL_BYTES:2147483648}
    accept: ${SDV_PDF_ACCEPT:}

  # Task 0062: the folders an IT Admin may keep documents in, separated by ';'. Empty: only "data" under Vero's working
  # folder. Volumes that exist already stay usable.
  storage:
    allowed-roots: ${SDV_STORAGE_ALLOWED_ROOTS:}

  crypto:
    # 'disabled' keeps Foundation/local admin runtime independent of a key service until document upload is enabled.
    # Set SDV_KEY_PROVIDER=vault for Vault Transit-backed SDV-ENC-001 operations.
    key-provider: ${SDV_KEY_PROVIDER:disabled}
    vault:
      base-url: ${SDV_VAULT_BASE_URL:}
      # Supply exactly one: direct token (local/dev) or token-file (recommended for mounted secret injection).
      token: ${SDV_VAULT_TOKEN:}
      token-file: ${SDV_VAULT_TOKEN_FILE:}
      mount: ${SDV_VAULT_TRANSIT_MOUNT:transit}
      key-prefix: ${SDV_VAULT_KEY_PREFIX:sdv-tenant-}

  retention:
    # Automatic cleanup runs once a day at this time: HH:mm, 24-hour, in the server's time zone.
    daily-at: ${SDV_RETENTION_DAILY_AT:02:00}
    # For check scripts only: a Spring cron expression that replaces daily-at when set. Leave empty.
    cron: ${SDV_RETENTION_CRON:}

  # Task 0028: approvals. How long an approved Highly Confidential print or download stays usable (hours, 1-168),
  # and how long a request may wait undecided before it expires (days, 1-90). Per tenant: tenant id=number, comma-separated.
  approvals:
    grant-hours: ${SDV_APPROVALS_GRANT_HOURS:24}
    pending-days: ${SDV_APPROVALS_PENDING_DAYS:7}
    tenant-grant-hours: ${SDV_APPROVALS_TENANT_GRANT_HOURS:}
    tenant-pending-days: ${SDV_APPROVALS_TENANT_PENDING_DAYS:}

  # Task 0032: the time zone a tenant's days are counted in ("today" in the Daily intake report) when the tenant has no
  # setting of its own (tenants.time_zone). An IANA name such as America/New_York; an unknown name stops the server.
  tenant-defaults:
    time-zone: ${SDV_DEFAULT_TIME_ZONE:UTC}

  # Task 0040: unidentified intake attempts (Problems) are one row per key per minute; past this many rows in a minute,
  # new caller addresses share one "(many addresses)" row. A whole number from 1 to 10000; anything else stops the
  # start (SDV-SYS-005).
  problems:
    unidentified-attempts:
      max-rows-per-minute: ${SDV_UNIDENTIFIED_ATTEMPTS_MAX_ROWS_PER_MINUTE:100}

  # Task 0040 part 2: the busy answer (503 SDV-SYS-018) tells the caller to wait this many seconds (Retry-After). A
  # whole number from 1 to 300; anything else stops the start (SDV-SYS-005). The database pool's wait is not changed.
  busy:
    retry-after-seconds: ${SDV_BUSY_RETRY_AFTER_SECONDS:5}

