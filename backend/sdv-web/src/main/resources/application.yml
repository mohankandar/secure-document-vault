spring:
  application:
    name: secure-document-vault
  datasource:
    url: ${SDV_DB_URL:}
    username: ${SDV_DB_USERNAME:}
    password: ${SDV_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${SDV_DB_POOL_MAX:10}
      minimum-idle: ${SDV_DB_POOL_MIN:1}
  liquibase:
    # Starting Vero changes nothing in the database: outside the local profile Liquibase does not run at startup.
    # The customer's database team applies changesets with the schema step (Update-SDV-Schema.ps1 /
    # update-sdv-schema.sh, always context "production"), and DatabaseSchemaCheck refuses to serve until the
    # database matches. Only the local profile migrates at startup (application-local.yml, context "local").
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: production

server:
  port: ${SDV_SERVER_PORT:8280}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness: the process is alive. /actuator/health/readiness: Vero can take work. While the
      # database doesn't match this version Vero stays up (liveness UP) but is not ready (readiness OUT_OF_SERVICE).
      # Task 0037: readiness also pings the database (databaseConnection), so it is DOWN while the database is gone
      # after the start, and ready again when it answers.
      # Task 0038: with enterprise-jwt, readiness also fetches the sign-in hub's keys (signInKeys, SDV-AUT-004).
      # Task 0039 (owner answer to report 0038, 4): databaseConnection and signInKeys belong to readiness only. They
      # report NOT_READY (not DOWN). Only readiness lists NOT_READY in its status order and maps it to 503; the overall
      # /actuator/health and liveness don't list it, so Spring ignores it there and neither turns DOWN while the hub or
      # the database is away. Liveness stays livenessState only (Spring's default group), UP while the process runs.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,databaseSchema,databaseConnection,signInKeys
          status:
            order: down,out-of-service,not-ready,up,unknown
            http-mapping:
              down: 503
              out-of-service: 503
              not-ready: 503
  health:
    defaults:
      enabled: true
    # Task 0039: Spring's own database check would make the overall health DOWN while the database is away; Vero's
    # databaseConnection ping replaces it, in readiness only.
    db:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-no-correlation}] %logger{40} - %msg%n"

sdv:
  auth:
    # Production defaults fail closed. Local acceptance explicitly switches to local-header in application-local.yml.
    # Enterprise deployments set SDV_AUTH_MODE=enterprise-jwt and configure issuer/JWKS/audience below.
    mode: ${SDV_AUTH_MODE:disabled}
    jwt:
      issuer: ${SDV_AUTH_JWT_ISSUER:}
      jwk-set-uri: ${SDV_AUTH_JWT_JWK_SET_URI:}
      audience: ${SDV_AUTH_JWT_AUDIENCE:}
      # Optional defense-in-depth. 0 disables the maximum token-lifetime check.
      max-token-lifetime-seconds: ${SDV_AUTH_JWT_MAX_TOKEN_LIFETIME_SECONDS:0}
      # Human OIDC tenant is resolved from the configured IdP connection. The token claim remains a legacy/M2M fallback.
      tenant-id: ${SDV_AUTH_JWT_TENANT_ID:}
      tenant-claim: ${SDV_AUTH_JWT_TENANT_CLAIM:sdv_tenant_id}
      provider-id: ${SDV_AUTH_JWT_PROVIDER_ID:customer-oidc}
      username-claim: ${SDV_AUTH_JWT_USERNAME_CLAIM:preferred_username}
      email-claim: ${SDV_AUTH_JWT_EMAIL_CLAIM:email}
      display-name-claim: ${SDV_AUTH_JWT_DISPLAY_NAME_CLAIM:name}
      groups-claim: ${SDV_AUTH_JWT_GROUPS_CLAIM:groups}
      source-id-claim: ${SDV_AUTH_JWT_SOURCE_ID_CLAIM:sdv_source_id}
      # Product authorization stays in SDV: map customer-managed IdP groups to SDV roles.
      role-mappings:
        business-user: ${SDV_AUTH_GROUP_BUSINESS_USER:}
        document-steward: ${SDV_AUTH_GROUP_DOCUMENT_STEWARD:}
        # Task 0025: only this mapping gives RESTRICTED_STEWARD (a direct sdv_roles claim never does). Changes are
        # audited at start for every tenant. Never held with business-admin, tenant-it-admin or platform-operations-admin.
        restricted-steward: ${SDV_AUTH_GROUP_RESTRICTED_STEWARD:}
        business-admin: ${SDV_AUTH_GROUP_BUSINESS_ADMIN:}
        tenant-it-admin: ${SDV_AUTH_GROUP_TENANT_IT_ADMIN:}
        platform-operations-admin: ${SDV_AUTH_GROUP_PLATFORM_OPERATIONS_ADMIN:}
      # Transitional compatibility for the frozen enterprise-jwt contract. Disable after group mappings are configured.
      legacy-direct-role-claim-enabled: ${SDV_AUTH_LEGACY_DIRECT_ROLE_CLAIM_ENABLED:true}
      roles-claim: ${SDV_AUTH_JWT_ROLES_CLAIM:sdv_roles}

  crypto:
    # 'disabled' keeps Foundation/local admin runtime independent of a key service until document upload is enabled.
    # Set SDV_KEY_PROVIDER=vault for Vault Transit-backed SDV-ENC-001 operations.
    key-provider: ${SDV_KEY_PROVIDER:disabled}
    vault:
      base-url: ${SDV_VAULT_BASE_URL:}
      # Supply exactly one: direct token (local/dev) or token-file (recommended for mounted secret injection).
      token: ${SDV_VAULT_TOKEN:}
      token-file: ${SDV_VAULT_TOKEN_FILE:}
      mount: ${SDV_VAULT_TRANSIT_MOUNT:transit}
      key-prefix: ${SDV_VAULT_KEY_PREFIX:sdv-tenant-}

  retention:
    # Automatic cleanup runs once a day at this time: HH:mm, 24-hour, in the server's time zone.
    daily-at: ${SDV_RETENTION_DAILY_AT:02:00}
    # For check scripts only: a Spring cron expression that replaces daily-at when set. Leave empty.
    cron: ${SDV_RETENTION_CRON:}

  # Task 0028: approvals. How long an approved Highly Confidential print or download stays usable (hours, 1-168),
  # and how long a request may wait undecided before it expires (days, 1-90). Per tenant: tenant id=number, comma-separated.
  approvals:
    grant-hours: ${SDV_APPROVALS_GRANT_HOURS:24}
    pending-days: ${SDV_APPROVALS_PENDING_DAYS:7}
    tenant-grant-hours: ${SDV_APPROVALS_TENANT_GRANT_HOURS:}
    tenant-pending-days: ${SDV_APPROVALS_TENANT_PENDING_DAYS:}

  # Task 0032: the time zone a tenant's days are counted in ("today" in the Daily intake report) when the tenant has no
  # setting of its own (tenants.time_zone). An IANA name such as America/New_York; an unknown name stops the server.
  tenant-defaults:
    time-zone: ${SDV_DEFAULT_TIME_ZONE:UTC}

  # Task 0040: unidentified intake attempts (Problems) are one row per key per minute; past this many rows in a minute,
  # new caller addresses share one "(many addresses)" row. A whole number from 1 to 10000; anything else stops the
  # start (SDV-SYS-005).
  problems:
    unidentified-attempts:
      max-rows-per-minute: ${SDV_UNIDENTIFIED_ATTEMPTS_MAX_ROWS_PER_MINUTE:100}

  # Task 0040 part 2: the busy answer (503 SDV-SYS-018) tells the caller to wait this many seconds (Retry-After). A
  # whole number from 1 to 300; anything else stops the start (SDV-SYS-005). The database pool's wait is not changed.
  busy:
    retry-after-seconds: ${SDV_BUSY_RETRY_AFTER_SECONDS:5}

