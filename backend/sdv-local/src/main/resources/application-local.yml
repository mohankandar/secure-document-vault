spring:
  config:
    # Task 0076: the owner's login file beside the repository; a check script names its own.
    import: "optional:file:${SDV_VAULT_LOGIN_FILE:../secrets/vero-vault-approle.properties}"
  # Task 0041 (owner answer 10): the local profile no longer migrates at startup either. Run the schema step first
  # (.\Update-SDV-Schema.ps1 update), then setup and the demo step (.\Seed-SDV-Canvas-Demo.ps1 -Reset does all three).
  datasource:
    # Task 0076: documents of the older database sdv can not be read any more, so local work is in a new one beside it.
    url: ${SDV_LOCAL_DB_URL:jdbc:postgresql://localhost:5433/sdv_vero}
    username: sdv
    # Task 0064: never in git. The start scripts fill it from .runtime (scripts/local/Get-SdvLocalDbPassword.ps1).
    password: ${SDV_LOCAL_DB_PASSWORD:}

# Task 0075: the demo customer (dev/setup/licence-vero-demo.json).
platform:
  licensing:
    tenant-id: TEN-VERO-DEMO-0001
  # Task 0080: the erase log of the local database. A check script names its own folder for its scratch database.
  erase-log:
    location: ${SDV_ERASE_LOG_FOLDER:${user.home}/.vero/erase-log}
  # Task 0076: the local key service: the owner's Vault step (vero-transit and Vero's login file beside the repository).
  crypto:
    vault:
      address: ${SDV_KEY_SERVICE_ADDRESS:http://127.0.0.1:8200}

server:
  # Task 0064: this computer only; local sign-in has no password.
  address: 127.0.0.1
  port: 8280


sdv:
  auth:
    mode: ${SDV_AUTH_MODE:local-header}
  # Task 0062: the demo seed keeps its volumes under .runtime.
  storage:
    allowed-roots: ${SDV_STORAGE_ALLOWED_ROOTS:.runtime;data}
  # Task 0032: the local demo tenant (Acme Lending) counts its days in Eastern time, as on the Reports board.
  tenant-defaults:
    time-zone: ${SDV_DEFAULT_TIME_ZONE:America/New_York}
